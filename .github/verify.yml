name: SWI Verification Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Control-plane verification
      run: node scripts/swi-ci-check.mjs

    - name: Unit tests (vitest)
      run: npm test
      continue-on-error: true

    - name: Typecheck
      run: npx tsc --noEmit
      continue-on-error: true
