name: SWI Governance Backbone

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml jsonschema

      - name: YAML validation (registries)
        run: |
          python -c "
          import yaml
          for f in [
              'governance/MODULE_REGISTRY.yaml',
              'governance/VERSION_REGISTRY.yaml',
              'governance/DEPENDENCY_GRAPH.yaml',
              'governance/ADMISSION_POLICY.yaml',
              'governance/COMPLIANCE_ALIGNMENT_MATRIX.yaml',
          ]:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f'OK: {f}')
          "

      - name: Python syntax check
        run: |
          python -m py_compile admission/halt.py
          python -m py_compile admission/seal_verifier.py
          python -m py_compile admission/dependency_gate.py
          python -m py_compile admission/validator.py
          python -m py_compile admission/execution_gate.py
          python -m py_compile admission/route_canonical.py
          python -m py_compile admission/route_store.py
          python -m py_compile admission/route_chain.py
          python -m py_compile admission/integrity.py
          python -m py_compile admission/__init__.py
          python -m py_compile scripts/discover_workflows.py
          python -m py_compile scripts/verify_workflow_activation.py
          python -m py_compile scripts/inspect_workflow_security.py
          python -m py_compile scripts/verify_route_chain.py

      - name: Schema validation
        run: |
          python -c "
          import json
          for schema in [
              'evidence/schema/admission_event.schema.json',
              'evidence/schema/halt_event.schema.json',
              'evidence/schema/route_record.schema.json',
          ]:
              with open(schema) as f:
                  json.load(f)
              print(f'OK schema: {schema}')
          "

      - name: Run admission tests
        run: pytest tests/admission/ -v --tb=short

      - name: Run route provenance tests
        run: pytest tests/route/ -v --tb=short

      - name: Run determinism tests
        run: pytest tests/determinism/ -v --tb=short

      - name: Run workflow gate tests
        run: pytest tests/governance/ -v --tb=short

      - name: Verify route chain
        run: python scripts/verify_route_chain.py

      - name: Discover workflows (classify only)
        run: python scripts/discover_workflows.py

      - name: Verify workflow activation gate
        run: python scripts/verify_workflow_activation.py

      - name: Inspect workflow security (no activation)
        run: python scripts/inspect_workflow_security.py

      - name: Registry consistency — SEALED requires seal record (HARD FAIL)
        run: |
          python -c "
          import yaml, sys
          from pathlib import Path
          with open('governance/MODULE_REGISTRY.yaml') as f:
              reg = yaml.safe_load(f)
          seal_dir = Path('governance/seal_records')
          missing = [mid for mid, m in reg.get('modules', {}).items()
                     if m.get('state') == 'SEALED' and not any(
                         (seal_dir / f'{mid}{ext}').exists()
                         for ext in ('.yaml', '.json', '.md'))]
          if missing:
              print('ERROR: SEALED without seal records:', missing)
              sys.exit(1)
          print('Registry SEALED consistency OK')
          "
